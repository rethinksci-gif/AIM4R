theme: jekyll-theme-cayman
title: AIM4R · 材料研发研究雷达
description: AI for Materials R&D & Manufacturing — 面向材料研发工程师的研究雷达
baseurl: "/AIM4R" # the subpath of your site, e.g. /blog
url: "https://rethinksci-gif.github.io" # the base hostname & protocol for your site, e.g. http://example.com

# Build settings
markdown: kramdown
future: true # Allow future posts to be published
plugins:
  - jekyll-feed
feed:
  path: feed.xml
exclude:
  - ".github"
  - "node_modules"
  - "_previews"

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "default"
