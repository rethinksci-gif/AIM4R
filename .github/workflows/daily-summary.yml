name: AIM4R Research Radar

on:
  schedule:
    # Weekly, Sunday 23:00 UTC (Monday 07:00 Asia/Shanghai). The research
    # config looks back one week (nine days for arXiv, to cover its
    # announcement lag) and the history ledger removes items already handled,
    # so a delayed run loses nothing and the overlap duplicates nothing.
    - cron: '0 23 * * 0'
  workflow_dispatch:      # Allow manual trigger

concurrency:
  group: aim4r-radar
  cancel-in-progress: false

jobs:
  research-radar:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed to publish to gh-pages

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"

      - name: Install dependencies
        run: uv sync

      - name: Restore run history from gh-pages
        # The ledger of seen items and run statuses lives next to the
        # published site. A missing ledger (first run) starts empty.
        run: |
          mkdir -p docs/_data
          if git fetch --depth=1 origin gh-pages \
             && git show FETCH_HEAD:_data/aim4r_history.json > docs/_data/aim4r_history.json; then
            echo "Restored history ledger."
          else
            rm -f docs/_data/aim4r_history.json
            echo "No history ledger on gh-pages yet; starting fresh."
          fi

      - name: Run research radar
        id: radar
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run horizon --config data/config.material-intel.json

      - name: Set current date as environment variable
        if: always()
        run: echo "DATE=$(date -u +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Deploy edition and run status to GitHub Pages
        # Runs after failures too, so the site shows "collection failed" or
        # "processing failed" instead of silently showing nothing. A failed
        # run writes no post, only its status. The job still fails, so the
        # failure is also reported by GitHub.
        if: always() && hashFiles('docs/_data/aim4r_history.json') != ''
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true  # Keep existing editions on gh-pages branch
          commit_message: "Research radar: ${{ env.DATE }} (${{ steps.radar.outcome }})"
          publish_branch: gh-pages
          enable_jekyll: true
